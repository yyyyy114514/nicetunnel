<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Edge Service</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#273444}
    main{width:min(88vw,560px);padding:42px;border:1px solid #dde3e8;border-radius:14px;background:#fff;box-shadow:0 10px 30px #1c2b3910}
    h1{font-size:24px;margin:0 0 12px}p{line-height:1.7;margin:8px 0;color:#607080}
    .status{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-size:14px;color:#278156}
    .dot{width:8px;height:8px;border-radius:50%;background:#36a372}
    small{display:block;margin-top:28px;color:#8a969f}
    @media(prefers-color-scheme:dark){body{background:#12181e;color:#dce5ec}main{background:#1a232b;border-color:#2d3943}p{color:#9dabb6}small{color:#71818e}}
  </style>
</head>
<body>
  <main>
    <h1>Edge Service</h1>
    <p>边缘资源服务已完成部署。此页面用于确认站点接入和静态资源分发状态。</p>
    <div class="status"><span class="dot"></span>Service online</div>
    <small>nicetunnel · Cloudflare Workers / Pages</small>
  </main>
</body>
</html>
