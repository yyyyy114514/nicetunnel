<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>site-status · 状态页</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;background:#f6f7f9;color:#243142}
    main{max-width:720px;margin:0 auto;padding:48px 20px}
    h1{font-size:22px;margin:0 0 4px}
    .sub{color:#66748a;font-size:14px;margin-bottom:28px}
    .bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border:1px solid #dfe4ea;border-radius:10px;background:#fff;font-size:14px;margin-bottom:10px}
    .bar .dot{width:9px;height:9px;border-radius:50%;background:#2e9e63;flex:none}
    .bar .name{flex:1}
    .bar .ms{color:#66748a;font-variant-numeric:tabular-nums}
    .foot{margin-top:36px;color:#8a95a3;font-size:12.5px}
    @media(prefers-color-scheme:dark){
      body{background:#10151c;color:#e2e8f0}
      .bar{background:#171e27;border-color:#273039}
      .sub,.bar .ms{color:#93a0b0}
      .foot{color:#6d7889}
    }
  </style>
</head>
<body>
  <main>
    <h1>site-status</h1>
    <div class="sub">站点状态监测 · 每 5 分钟更新一次</div>
    <div class="bar"><span class="dot"></span><span class="name">主站</span><span class="ms">142 ms</span></div>
    <div class="bar"><span class="dot"></span><span class="name">API 服务</span><span class="ms">88 ms</span></div>
    <div class="bar"><span class="dot"></span><span class="name">静态资源</span><span class="ms">31 ms</span></div>
    <div class="foot">Powered by site-status · Cloudflare Workers / Pages</div>
  </main>
</body>
</html>
